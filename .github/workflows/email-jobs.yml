name: Email jobs
# Delivers pending and retried emails even when the site has no traffic.
# Needs repository secrets APP_URL (e.g. https://fya.pt) and CRON_SECRET (same value as the server).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the email worker
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET is not configured; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/jobs/email"
