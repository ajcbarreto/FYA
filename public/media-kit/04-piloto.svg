<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title"><title id="title">FYA — O teu canil pode ajudar a construir o próximo passo.</title><rect width="1080" height="1080" fill="#214e43"/><text x="80" y="180" fill="#fff" font-family="Arial, sans-serif" font-size="90" font-weight="700">fya</text><text x="215" y="180" fill="#db7046" font-family="Arial, sans-serif" font-size="90" font-weight="700">.</text><text x="80" y="390" fill="#fff" font-family="Arial, sans-serif" font-size="70" font-weight="700">O teu canil pode</text><text x="80" y="495" fill="#fff" font-family="Arial, sans-serif" font-size="70" font-weight="700">ajudar a construir</text><text x="80" y="600" fill="#fff" font-family="Arial, sans-serif" font-size="70" font-weight="700">o próximo passo.</text><text x="80" y="820" fill="#fff" font-family="Arial, sans-serif" font-size="27" font-weight="700">Conhece o piloto FYA e partilha as tuas necessidades.</text><text x="80" y="970" fill="#d9e5da" font-family="Arial, sans-serif" font-size="24" font-weight="700">FYA · Piloto em preparação</text></svg>
